<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>YFF – Vurdering av praksis</title>
  <style>
    :root {
      --blue:    #1a56db;
      --blue-lt: #e8f0fe;
      --green:   #0e9f6e;
      --green-lt:#d5f5e9;
      --red:     #e02424;
      --bg:      #f3f4f6;
      --white:   #ffffff;
      --border:  #d1d5db;
      --gray:    #6b7280;
      --text:    #111827;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* TOP BAR */
    header {
      background: var(--blue);
      color: #fff;
      padding: 14px 16px 10px;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 8px rgba(0,0,0,.25);
    }
    header h1 { font-size: 1.1rem; font-weight: 700; }
    header p  { font-size: .75rem; opacity: .85; margin-top: 2px; }
    #autosave-status { font-size: .72rem; opacity: .8; margin-top: 3px; min-height: 1em; }

    main { max-width: 640px; margin: 0 auto; padding: 12px 12px 100px; }

    /* STUDENT LIST */
    .panel-title {
      font-size: .72rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: .6px; color: var(--gray); margin-bottom: 6px;
    }
    #student-list { display: flex; flex-direction: column; gap: 6px; }

    .student-item {
      background: var(--white);
      border: 1.5px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      user-select: none;
    }
    .student-item.active { border-color: var(--blue); background: var(--blue-lt); }
    .student-item .s-name { font-weight: 600; font-size: .95rem; }
    .student-item .s-meta { font-size: .78rem; color: var(--gray); margin-top: 1px; }
    .student-item .s-date { font-size: .72rem; color: var(--gray); white-space: nowrap; }
    .del-btn {
      background: none; border: none; cursor: pointer; color: var(--gray);
      font-size: 1.1rem; padding: 4px 6px; border-radius: 6px; flex-shrink: 0;
      touch-action: manipulation;
    }
    .del-btn:active { color: var(--red); background: #fde8e8; }

    #btn-new {
      margin-top: 8px; width: 100%; padding: 11px;
      border: 2px dashed var(--blue); background: transparent;
      color: var(--blue); font-weight: 600; font-size: .95rem;
      border-radius: 10px; cursor: pointer; touch-action: manipulation;
    }
    #btn-new:active { background: var(--blue-lt); }

    .empty-state { text-align: center; padding: 28px 16px; color: var(--gray); }
    .empty-state .icon { font-size: 2.2rem; margin-bottom: 8px; }
    .empty-state p { font-size: .88rem; line-height: 1.5; }

    /* FORM */
    #form-area { display: none; margin-top: 12px; }

    .form-top {
      background: var(--blue); color: #fff; padding: 11px 13px;
      border-radius: 12px 12px 0 0;
      display: flex; align-items: center; justify-content: space-between;
    }
    .form-top span { font-weight: 700; font-size: .95rem; }
    #btn-close {
      background: rgba(255,255,255,.2); border: none; color: #fff;
      font-size: 1.1rem; width: 30px; height: 30px; border-radius: 7px;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      touch-action: manipulation; flex-shrink: 0;
    }

    .form-body {
      background: var(--white);
      border: 1.5px solid var(--border);
      border-top: none;
      border-radius: 0 0 12px 12px;
    }

    /* SECTIONS */
    .section { padding: 14px; }
    .section + .section { border-top: 1px solid var(--border); }

    .sec-label {
      font-size: .7rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: .7px; color: var(--blue); margin-bottom: 10px;
    }

    /* fields */
    .field { margin-bottom: 10px; }
    .field:last-child { margin-bottom: 0; }
    label.field-label {
      display: block; font-size: .8rem; font-weight: 600;
      color: var(--gray); margin-bottom: 4px;
    }
    input[type=text], input[type=date], textarea {
      width: 100%; padding: 9px 11px;
      border: 1.5px solid var(--border); border-radius: 8px;
      font-size: 1rem; font-family: inherit;
      background: var(--white); color: var(--text);
      -webkit-appearance: none;
    }
    input[type=text]:focus, input[type=date]:focus, textarea:focus {
      outline: none; border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(26,86,219,.15);
    }
    textarea { resize: vertical; min-height: 70px; line-height: 1.5; }

    .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .row2 .field { margin-bottom: 0; }

    .row-small { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .row-small .field { margin-bottom: 0; }
    .row-small input { text-align: center; }

    /* CHECKBOXES */
    .checks { display: flex; flex-direction: column; gap: 5px; margin-bottom: 8px; }
    .chk {
      display: flex; align-items: center; gap: 9px;
      padding: 8px 10px; border: 1.5px solid var(--border);
      border-radius: 8px; cursor: pointer; user-select: none;
      touch-action: manipulation; font-size: .9rem; font-weight: 500;
    }
    .chk.on { background: var(--green-lt); border-color: var(--green); }
    .chk input { display: none; }
    .chk-box {
      width: 20px; height: 20px; border: 2px solid var(--border);
      border-radius: 5px; background: #fff; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: .8rem; transition: all .12s;
    }
    .chk.on .chk-box { background: var(--green); border-color: var(--green); color: #fff; }

    /* ACTIONS */
    .form-actions {
      padding: 12px 14px; display: flex; gap: 8px;
      border-top: 1px solid var(--border); background: var(--bg);
      border-radius: 0 0 12px 12px;
    }
    .btn {
      flex: 1; padding: 12px 8px; border: none; border-radius: 9px;
      font-size: .93rem; font-weight: 700; cursor: pointer;
      touch-action: manipulation;
    }
    .btn-save   { background: var(--green); color: #fff; }
    .btn-export { background: #6b7280;      color: #fff; }

    /* EXPORT MODAL */
    #exp-modal {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,.55); z-index: 200;
      padding: 16px; overflow-y: auto;
    }
    #exp-modal.open { display: flex; align-items: flex-start; justify-content: center; }
    #exp-box {
      background: var(--white); border-radius: 13px;
      width: 100%; max-width: 620px; overflow: hidden; margin: auto;
    }
    #exp-box header {
      background: var(--blue); padding: 11px 13px; color: #fff;
      display: flex; align-items: center; justify-content: space-between;
      font-weight: 700;
    }
    #exp-box header button {
      background: rgba(255,255,255,.2); border: none; color: #fff;
      font-size: 1.1rem; width: 30px; height: 30px; border-radius: 7px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    #exp-content {
      padding: 13px; white-space: pre-wrap;
      font-family: "Courier New", monospace; font-size: .8rem; line-height: 1.6;
      background: #1e1e1e; color: #d4d4d4; max-height: 60vh; overflow-y: auto;
    }
    #exp-copy {
      display: block; width: calc(100% - 26px); margin: 13px;
      padding: 12px; background: var(--blue); color: #fff;
      border: none; border-radius: 9px; font-size: .93rem; font-weight: 700; cursor: pointer;
    }

    /* TOAST */
    #toast {
      position: fixed; bottom: 76px; left: 50%;
      transform: translateX(-50%) translateY(16px);
      background: #1f2937; color: #fff; padding: 9px 16px;
      border-radius: 18px; font-size: .86rem; font-weight: 600;
      opacity: 0; transition: opacity .22s, transform .22s;
      pointer-events: none; white-space: nowrap; z-index: 300;
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    @media (prefers-color-scheme: dark) {
      :root { --bg:#111827; --white:#1f2937; --border:#374151; --text:#f9fafb; --gray:#9ca3af; --blue-lt:#1e3a5f; --green-lt:#065f46; }
      input, textarea { background:#1f2937; color:#f9fafb; }
      .chk-box { background:#374151; }
      .form-actions { background:#111827; }
    }
  </style>
</head>
<body>

<header>
  <h1>YFF – Vurdering av praksis</h1>
  <p>Samtalenotat ved besøk</p>
  <div id="autosave-status"></div>
</header>

<main>
  <div id="student-panel">
    <div class="panel-title">Elever</div>
    <div id="student-list">
      <div class="empty-state">
        <div class="icon">📋</div>
        <p>Ingen elever ennå.<br>Trykk «+ Ny elev» for å starte.</p>
      </div>
    </div>
    <button id="btn-new">+ Ny elev</button>
  </div>

  <div id="form-area">
    <div class="form-top">
      <span id="form-title">Nytt notat</span>
      <button id="btn-close">✕</button>
    </div>
    <div class="form-body">

      <!-- Grunninfo -->
      <div class="section">
        <div class="sec-label">Grunninfo</div>
        <div class="field">
          <label class="field-label">Navn på elev *</label>
          <input type="text" id="f-elev" placeholder="Fornavn Etternavn" autocomplete="off">
        </div>
        <div class="row2">
          <div class="field">
            <label class="field-label">Dato for besøk</label>
            <input type="date" id="f-dato">
          </div>
          <div class="field">
            <label class="field-label">Klasse</label>
            <input type="text" id="f-klasse" placeholder="f.eks. 1STA">
          </div>
        </div>
        <div class="row2">
          <div class="field">
            <label class="field-label">Bedriftens navn</label>
            <input type="text" id="f-bedrift" placeholder="Bedrift AS">
          </div>
          <div class="field">
            <label class="field-label">Kontaktperson</label>
            <input type="text" id="f-kontakt" placeholder="Navn">
          </div>
        </div>
      </div>

      <!-- Pålitelighet -->
      <div class="section">
        <div class="sec-label">Pålitelighet</div>
        <div class="checks">
          <label class="chk" onclick="toggle(this)">
            <input type="checkbox" data-key="pal1">
            <div class="chk-box">✓</div>
            <span>Møter til avtalt tid</span>
          </label>
          <label class="chk" onclick="toggle(this)">
            <input type="checkbox" data-key="pal2">
            <div class="chk-box">✓</div>
            <span>Gir beskjed ved forsinkelse</span>
          </label>
          <label class="chk" onclick="toggle(this)">
            <input type="checkbox" data-key="pal3">
            <div class="chk-box">✓</div>
            <span>Overholder avtalte pauser</span>
          </label>
        </div>
        <textarea id="f-pal" placeholder="Kommentar..."></textarea>
      </div>

      <!-- Initiativ -->
      <div class="section">
        <div class="sec-label">Initiativ</div>
        <div class="checks">
          <label class="chk" onclick="toggle(this)">
            <input type="checkbox" data-key="ini1">
            <div class="chk-box">✓</div>
            <span>Melder seg ledig for nye oppgaver</span>
          </label>
          <label class="chk" onclick="toggle(this)">
            <input type="checkbox" data-key="ini2">
            <div class="chk-box">✓</div>
            <span>Holder arbeidsplassen ryddig</span>
          </label>
          <label class="chk" onclick="toggle(this)">
            <input type="checkbox" data-key="ini3">
            <div class="chk-box">✓</div>
            <span>Serviceinnstilt til kunder</span>
          </label>
        </div>
        <textarea id="f-ini" placeholder="Kommentar..."></textarea>
      </div>

      <!-- Interesse og utførelse -->
      <div class="section">
        <div class="sec-label">Interesse og utførelse</div>
        <div class="checks">
          <label class="chk" onclick="toggle(this)">
            <input type="checkbox" data-key="int1">
            <div class="chk-box">✓</div>
            <span>Viser interesse for tildelte oppgaver</span>
          </label>
          <label class="chk" onclick="toggle(this)">
            <input type="checkbox" data-key="int2">
            <div class="chk-box">✓</div>
            <span>Utfører oppgaver effektivt</span>
          </label>
          <label class="chk" onclick="toggle(this)">
            <input type="checkbox" data-key="int3">
            <div class="chk-box">✓</div>
            <span>Tilegner seg nye kunnskaper</span>
          </label>
        </div>
        <textarea id="f-int" placeholder="Kommentar..."></textarea>
      </div>

      <!-- Arbeidsmiljø -->
      <div class="section">
        <div class="sec-label">Arbeidsmiljø</div>
        <div class="checks">
          <label class="chk" onclick="toggle(this)">
            <input type="checkbox" data-key="arb1">
            <div class="chk-box">✓</div>
            <span>Fungerer sosialt på arbeidsplassen</span>
          </label>
          <label class="chk" onclick="toggle(this)">
            <input type="checkbox" data-key="arb2">
            <div class="chk-box">✓</div>
            <span>Samarbeider godt med andre ansatte</span>
          </label>
        </div>
        <textarea id="f-arb" placeholder="Kommentar..."></textarea>
      </div>

      <!-- Fravær -->
      <div class="section">
        <div class="sec-label">Fravær</div>
        <div class="row-small">
          <div class="field">
            <label class="field-label">Dager</label>
            <input type="text" id="f-fravaer-dager" placeholder="0">
          </div>
          <div class="field">
            <label class="field-label">Timer</label>
            <input type="text" id="f-fravaer-timer" placeholder="0">
          </div>
        </div>
      </div>

      <!-- Kommentar fra arbeidsgiver -->
      <div class="section">
        <div class="sec-label">Kommentar fra arbeidsgiver</div>
        <textarea id="f-ag-kommentar" placeholder="Annet arbeidsgiver ønsker å si ifra om..." style="min-height:90px;"></textarea>
      </div>

      <!-- Før elevbesøk -->
      <div class="section">
        <div class="sec-label">Før elevbesøk – loggføring</div>
        <textarea id="f-logg" placeholder="Fremovermelding på logg..." style="min-height:80px;"></textarea>
      </div>

      <!-- Elevens opplevelse -->
      <div class="section">
        <div class="sec-label">Elevens opplevelse</div>
        <textarea id="f-elev-oppl" placeholder="Arbeidshverdag, oppgaver, erfaringer..." style="min-height:110px;"></textarea>
      </div>

    </div><!-- /form-body -->

    <div class="form-actions">
      <button class="btn btn-save"   id="btn-save">Lagre</button>
      <button class="btn btn-export" id="btn-export">Eksporter</button>
    </div>
  </div><!-- /form-area -->
</main>

<!-- Export modal -->
<div id="exp-modal">
  <div id="exp-box">
    <header>
      <span>Eksporter notat</span>
      <button id="btn-close-exp">✕</button>
    </header>
    <pre id="exp-content"></pre>
    <button id="exp-copy">Kopier tekst</button>
  </div>
</div>

<div id="toast"></div>

<script>
const STORE = 'yff_v3';
const load  = () => { try { return JSON.parse(localStorage.getItem(STORE)) || []; } catch { return []; } };
const save  = d  => localStorage.setItem(STORE, JSON.stringify(d));
const $     = id => document.getElementById(id);
const val   = id => $(id).value.trim();
const set   = (id, v) => $(id).value = v || '';
const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2);

let currentId = null, dirty = false, timer = null;

// ── ALL CHECKBOX KEYS ────────────────────────────────────────────────────────
const CHK_KEYS = ['pal1','pal2','pal3','ini1','ini2','ini3','int1','int2','int3','arb1','arb2'];

// ── READ / WRITE FORM ────────────────────────────────────────────────────────
function readForm() {
  const checks = {};
  CHK_KEYS.forEach(k => {
    const el = document.querySelector(`input[data-key="${k}"]`);
    checks[k] = el ? el.checked : false;
  });
  return {
    elev:          val('f-elev'),
    dato:          val('f-dato'),
    klasse:        val('f-klasse'),
    bedrift:       val('f-bedrift'),
    kontakt:       val('f-kontakt'),
    checks,
    pal:           val('f-pal'),
    ini:           val('f-ini'),
    int:           val('f-int'),
    arb:           val('f-arb'),
    fravaerDager:  val('f-fravaer-dager'),
    fravaerTimer:  val('f-fravaer-timer'),
    agKommentar:   val('f-ag-kommentar'),
    logg:          val('f-logg'),
    elevOppl:      val('f-elev-oppl'),
  };
}

function writeForm(d) {
  set('f-elev',          d.elev);
  set('f-dato',          d.dato);
  set('f-klasse',        d.klasse);
  set('f-bedrift',       d.bedrift);
  set('f-kontakt',       d.kontakt);
  set('f-pal',           d.pal);
  set('f-ini',           d.ini);
  set('f-int',           d.int);
  set('f-arb',           d.arb);
  set('f-fravaer-dager', d.fravaerDager);
  set('f-fravaer-timer', d.fravaerTimer);
  set('f-ag-kommentar',  d.agKommentar);
  set('f-logg',          d.logg);
  set('f-elev-oppl',     d.elevOppl);

  CHK_KEYS.forEach(k => {
    const input = document.querySelector(`input[data-key="${k}"]`);
    if (!input) return;
    const on = !!(d.checks && d.checks[k]);
    input.checked = on;
    input.closest('.chk').classList.toggle('on', on);
  });
}

// ── CHECKBOX TOGGLE ──────────────────────────────────────────────────────────
function toggle(el) {
  const cb = el.querySelector('input[type=checkbox]');
  cb.checked = !cb.checked;
  el.classList.toggle('on', cb.checked);
  triggerAutosave();
}

// ── AUTOSAVE ─────────────────────────────────────────────────────────────────
function triggerAutosave() {
  dirty = true;
  clearTimeout(timer);
  timer = setTimeout(doSave, 1500);
  $('autosave-status').textContent = 'Redigerer...';
}

function doSave(showToast) {
  if (!dirty) return;
  const data = readForm();
  if (!data.elev) return;
  const all = load();
  const ts  = new Date().toISOString();
  if (currentId) {
    const i = all.findIndex(e => e.id === currentId);
    if (i > -1) all[i] = { ...all[i], ...data, oppdatert: ts };
    else all.push({ id: currentId, ...data, opprettet: ts, oppdatert: ts });
  } else {
    currentId = newId();
    all.push({ id: currentId, ...data, opprettet: ts, oppdatert: ts });
  }
  save(all);
  dirty = false;
  renderList();
  $('autosave-status').textContent = 'Lagret ✓';
  setTimeout(() => $('autosave-status').textContent = '', 3000);
  if (showToast) toast('Notat lagret!');
}

// ── RENDER LIST ───────────────────────────────────────────────────────────────
function renderList() {
  const all  = load();
  const list = $('student-list');
  if (!all.length) {
    list.innerHTML = `<div class="empty-state"><div class="icon">📋</div><p>Ingen elever ennå.<br>Trykk «+ Ny elev» for å starte.</p></div>`;
    return;
  }
  list.innerHTML = all.slice().sort((a,b) => (a.elev||'').localeCompare(b.elev||'')).map(e => {
    const dato = e.dato ? new Date(e.dato).toLocaleDateString('no-NO',{day:'2-digit',month:'short',year:'numeric'}) : '';
    return `<div class="student-item ${e.id===currentId?'active':''}" onclick="openStudent('${e.id}')">
      <div>
        <div class="s-name">${e.elev||'(uten navn)'}</div>
        <div class="s-meta">${[e.klasse,e.bedrift].filter(Boolean).join(' · ')}</div>
      </div>
      <div style="display:flex;align-items:center;gap:6px;flex-shrink:0;">
        <span class="s-date">${dato}</span>
        <button class="del-btn" onclick="delStudent(event,'${e.id}')">🗑</button>
      </div>
    </div>`;
  }).join('');
}

// ── OPEN / NEW / CLOSE ────────────────────────────────────────────────────────
function openStudent(id) {
  const e = load().find(x => x.id === id);
  if (!e) return;
  currentId = id; dirty = false;
  writeForm(e);
  $('form-title').textContent = e.elev || 'Rediger notat';
  showForm(); renderList();
}

function openNew() {
  currentId = null; dirty = false;
  writeForm({});
  $('f-dato').value = new Date().toISOString().slice(0,10);
  $('form-title').textContent = 'Nytt notat';
  showForm();
}

function showForm() {
  $('form-area').style.display = 'block';
  $('form-area').scrollIntoView({behavior:'smooth', block:'start'});
}

function closeForm() {
  if (dirty) doSave(false);
  $('form-area').style.display = 'none';
  currentId = null; renderList();
}

function delStudent(evt, id) {
  evt.stopPropagation();
  const e = load().find(x => x.id === id);
  if (!confirm(`Slette notat for ${e?.elev||'denne eleven'}?`)) return;
  save(load().filter(x => x.id !== id));
  if (currentId === id) { currentId = null; $('form-area').style.display = 'none'; }
  renderList(); toast('Slettet.');
}

// ── EXPORT ────────────────────────────────────────────────────────────────────
function doExport() {
  const d  = readForm();
  const c  = d.checks || {};
  const yn = k => c[k] ? '☑' : '☐';
  const datofmt = s => s ? new Date(s).toLocaleDateString('no-NO') : '–';
  const ts = new Date().toLocaleString('no-NO');

  const txt =
`YFF – VURDERING AV PRAKSIS
Eksportert: ${ts}
═══════════════════════════════════

Elev:          ${d.elev||'–'}
Klasse:        ${d.klasse||'–'}
Dato for besøk:${datofmt(d.dato)}
Bedrift:       ${d.bedrift||'–'}
Kontaktperson: ${d.kontakt||'–'}

───────────────────────────────────
PÅLITELIGHET
${yn('pal1')} Møter til avtalt tid
${yn('pal2')} Gir beskjed ved forsinkelse
${yn('pal3')} Overholder avtalte pauser
${d.pal?`Kommentar: ${d.pal}`:''}

INITIATIV

// ── CLIPBOARD ─────────────────────────────────────────────────────────────────
$('exp-copy').addEventListener('click', () => {
  const txt = $('exp-content').textContent;
  navigator.clipboard.writeText(txt)
    .then(() => toast('Kopiert!'))
    .catch(() => { const t=document.createElement('textarea'); t.value=txt; t.style.cssText='position:fixed;opacity:0'; document.body.appendChild(t); t.select(); document.execCommand('copy'); document.body.removeChild(t); toast('Kopiert!'); });
});

// ── TOAST ─────────────────────────────────────────────────────────────────────
function toast(msg) {
  const el = $('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2400);
}

// ── WIRE UP ───────────────────────────────────────────────────────────────────
$('btn-new').addEventListener('click', openNew);
$('btn-close').addEventListener('click', closeForm);
$('btn-save').addEventListener('click', () => { dirty=true; doSave(true); $('form-title').textContent = val('f-elev')||'Rediger notat'; });
$('btn-export').addEventListener('click', doExport);
$('btn-close-exp').addEventListener('click', () => $('exp-modal').classList.remove('open'));
$('form-area').addEventListener('input', triggerAutosave);
window.addEventListener('beforeunload', e => { if (dirty) { e.preventDefault(); e.returnValue=''; } });

renderList();
</script>
